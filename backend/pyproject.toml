[project]
name = "pinpoint-pdf"
version = "0.1.0"
description = "Layout-aware PDF RAG chatbot with summary-first retrieval"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "boto3>=1.35.0",
    "google-cloud-storage>=2.18.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.17",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "pinecone>=5.0.0",
    "sentence-transformers>=3.3.0",
    "tiktoken>=0.8.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "celery[redis]>=5.4.0",
    # LangChain ecosystem
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.1.0",
    "langchain-pinecone>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "api",
    "api.routes",
    "clients",
    "workers",
    "workers.worker_a_preprocess",
    "workers.worker_b_chunk_summarize",
    "workers.worker_c_index_store",
    "preprocessing",
    "chunking",
    "rag",
    "rag.query",
    "rag.retrieval",
    "rag.generation",
    "db",
    "tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
